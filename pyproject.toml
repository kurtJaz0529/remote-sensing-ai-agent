[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rsagent-cloud-core"
version = "0.1.0.dev3"
description = "Evidence-gated remote sensing agent core; cloud development preview"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "httpx==0.28.1", "packaging==26.3"]

[project.optional-dependencies]
mcp = ["mcp==1.28.1"]
science = ["numpy==2.5.4"]
documents = ["pypdf==6.10.0", "python-docx==1.2.0"]

[project.scripts]
rsagent = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "retrieval*", "contracts*", "adapters*", "methods*", "verification*", "reports*", "skills*"]

[tool.setuptools.package-data]
contracts = ["*.json"]
adapters = ["*.m"]
skills = ["*.json", "catalog/*.json"]
verification = ["acceptance_matrix.json", "screenshot_spec.json"]
